[platformio]
default_envs = sticky
boards_dir = boards

[inx]
version = 1.0.0

; ---------------------------------------------------------------------------
; Shared ESP32-S3 configuration.
; Both hardware targets (Seeed reTerminal Sticky and Xteink X4 Pro) are ESP32-S3
; parts driving the same SSD1677 800x480 panel through freeink-sdk, so everything
; that is not device-specific lives here. Per-device envs override only: board,
; flash size, partition table, the -DFREEINK_DEVICE_<NAME> selector, and the
; version string. Hardware access goes through freeink-sdk (a git submodule, see
; .gitmodules — kept pristine, not hand-edited); lib/hal_sticky/ is the board HAL
; wrapper shared by both targets.
; Use the pioarduino Arduino-ESP32 3.3.x platform (ESP-IDF 5.5.x). This is
; required for the native driver/i2s_pdm.h channel API used by Microphone and
; avoids the fixed-sample legacy PDM path from Arduino-ESP32 2.x/IDF 4.4.
[s3_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.7/esp32-core-3.3.7.tar.xz
monitor_speed = 115200
upload_speed = 921600

; Both boards pair QSPI flash with 8 MB octal PSRAM, run the CPU at its 240 MHz
; ceiling and the flash at 80 MHz. qio_opi selects the Arduino core's QIO-flash +
; octal-PSRAM prebuilt library variant.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.f_cpu = 240000000L

build_flags =
  -I${PROJECT_DIR}/src
  -I${PROJECT_DIR}/src/system
  -include${PROJECT_DIR}/src/system/TaskWatchdogCompat.h
  -Ifreeink-sdk/libs/hardware/SDCardManager/include
  ; NOTE: the USB/serial transport is NOT shared - the two boards route their
  ; console completely differently. See each env's own USB block below.
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DDISABLE_FS_H_WARNING=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  ; gnu++2a (not plain c++2a): the ESP32-S3 Arduino core's pgmspace.h needs the
  ; GNU `typeof` extension, which strict c++2a disables.
  -std=gnu++2a
  -DUSE_UTF8_LONG_NAMES=1
  -DBOARD_HAS_PSRAM
  -I${PROJECT_LIBDEPS_DIR}/${PIOENV}/stb
  ; Keep both ESP32-S3 LX7 cores enabled and allocate the display framebuffers
  ; from the octal PSRAM heap.
  -DCONFIG_FREERTOS_UNICORE=0
  -DFREEINK_FB_PSRAM=1

build_unflags =
  -std=gnu++11

build_src_filter =
  +<*>
  -<simulator/>
  ; Touch orientation is per-device (see src/system/TouchOrientation.h). Exactly one
  ; implementation links per env; each device env re-adds its own below.
  -<system/TouchOrientationSticky.cpp>
  -<system/TouchOrientationX4Pro.cpp>

extra_scripts =
  pre:scripts/build_html.py
  post:scripts/build_factory.py
  post:scripts/device_reset.py

lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  Rtc=symlink://freeink-sdk/libs/hardware/Rtc
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  https://github.com/nothings/stb.git#2c980bb59875b0d32144a71867fbdebb2f77cd20
  links2004/WebSockets @ 2.7.3
; stb is header-only here. Ignore the raw repository as a compiled library so its desktop test and
; profiling sources are not pulled into the firmware; JpegRender.cpp provides the implementation.
lib_ignore = stb

; ---------------------------------------------------------------------------
; Seeed reTerminal Sticky - ESP32-S3R8, 32 MB flash, 8 MB PSRAM, 3.97" 800x480
; SSD1677 touch E-Ink, Wi-Fi/BLE 5.0. -DFREEINK_DEVICE_STICKY=1 selects the
; Sticky board profile and enables its documented capabilities (touch, RTC,
; temp/humidity, IMU, PDM mic) from
; freeink-sdk/libs/hardware/BoardConfig/include/BoardConfig.h.
[env:sticky]
extends = s3_common
board = sticky-s3
board_upload.flash_size = 32MB
board_build.flash_size = 32MB
board_build.partitions = partitions_sticky.csv

; HAL selection: both lib/hal_sticky and lib/hal_x4pro export the same HalDisplay.h /
; HalGPIO.h interface, so exactly one must be visible to the LDF per environment.
lib_ignore =
  ${s3_common.lib_ignore}
  hal_x4pro

build_src_filter =
  ${s3_common.build_src_filter}
  +<system/TouchOrientationSticky.cpp>

build_flags =
  ${s3_common.build_flags}
  -DFREEINK_DEVICE_STICKY=1
  ; Sticky's USB-C runs through an on-board UART bridge to UART0, NOT the S3's
  ; native USB-OTG pins - GPIO19/20 are wired to Sticky's PDM mic instead.
  ; ARDUINO_USB_CDC_ON_BOOT=1 makes the Arduino core auto-initialize the native
  ; USB-CDC peripheral at boot, which claims GPIO19/20 at the hardware level even
  ; though nothing is wired to native USB here - that silently broke the mic (I2S
  ; read back a frozen, non-toggling value). Keep it 0 so nothing auto-attaches.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  ; With CDC_ON_BOOT=0 the core doesn't declare a separate Serial0 symbol - plain
  ; Serial IS the UART0 object directly in this mode.
  -DINX_SERIAL=Serial
  -DINX_VERSION=\"${inx.version}\"

; Sticky-only peripherals: PDM mic (voice notes), LSM6DS3TR-C IMU (tilt-to-turn),
; SHT40 temp/humidity. The X4 Pro has none of these, so they stay out of s3_common.
lib_deps =
  ${s3_common.lib_deps}
  Microphone=symlink://freeink-sdk/libs/hardware/Microphone
  Imu=symlink://freeink-sdk/libs/hardware/Imu
  EnvironmentSensor=symlink://freeink-sdk/libs/hardware/EnvironmentSensor

; ---------------------------------------------------------------------------
; Xteink X4 Pro - ESP32-S3R8, 16 MB flash, 8 MB PSRAM, 4.3" 800x480 (219 PPI)
; SSD1677 E-Ink with a GT911 glass digitizer, a dual warm/cold colour-temperature
; frontlight, physical page-turn buttons, BM8563 RTC, CW2017 fuel gauge and a
; 1-bit SDMMC card slot. Same panel controller and resolution as Sticky, so the
; whole display path is shared unchanged.
;
; The board profile (BoardConfig::XTEINK_X4_PRO) was recovered from the OEM flash
; dump and then confirmed on hardware - display, buttons, frontlight, RTC, SDMMC,
; GT911 touch and battery percentage are all verified upstream. See
; freeink-sdk/docs/xteink-x4pro-support.md for the pin evidence and the few items
; still pending (touch flipX/flipY, panel orientation, deep-sleep draw, USB-MSC).
;
; FLASHING: this device has NO USB-C port - only a proprietary pogo-pin connector.
; Uploading needs the OEM pogo dock or direct access to the board's UART pads;
; `pio run -e x4pro -t upload` assumes whichever serial adapter that exposes.
;
; SIZE: the app slots are 0x7E0000 (7.87 MB) vs Sticky's 0xC80000. The firmware is
; currently ~6.9 MiB, leaving roughly 1 MB of headroom - watch the size check.
[env:x4pro]
extends = s3_common
board = x4pro-s3
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions_x4pro.csv

; See the Sticky env's note: pick this board's HAL, hide the other one. lib/hal_x4pro
; talks to freeink-sdk's FreeInkDisplay directly - no Sticky LUTs, no `#define private
; public`, no unbounded BUSY poll, and crucially no SPI.begin(sclk, sd.miso, mosi)
; fixup, which on this board would bind SDMMC DAT0 (GPIO40) into the SPI peripheral.
lib_ignore =
  ${s3_common.lib_ignore}
  hal_sticky

build_flags =
  ${s3_common.build_flags}
  -DFREEINK_DEVICE_X4PRO=1
  ; Panel-timing override for the UC8279 driver — see lib/hal_x4pro/X4ProPanelConfig.cpp.
  ; Lengthens the fast (DU) waveform so partial refreshes stop leaving the previous frame
  ; behind. Everything else keeps the driver's hardware-validated defaults.
  -DFREEINK_UC8279_X4_CONFIG=x4proPanelConfig
  ; USB: unlike Sticky, the X4 Pro's data port IS the S3's native USB - GPIO19 = D-,
  ; GPIO20 = D+, brought out on the pogo connector (the OEM firmware runs USB-MSC +
  ; CDC over it, see freeink-sdk/docs/xteink-x4pro-support.md#rtc--usb--battery).
  ; There is no UART bridge here, so Sticky's CDC_ON_BOOT=0 / UART0 console would
  ; leave this board with no reachable serial output at all. Sticky's reason for
  ; disabling CDC - the PDM mic on GPIO19/20 - does not apply: the X4 Pro has no mic.
  ; ARDUINO_USB_MODE=1 selects the S3's built-in USB-Serial-JTAG (HWCDC) rather than
  ; TinyUSB OTG; with CDC_ON_BOOT=1 plain `Serial` is that USB console, which is also
  ; the port esptool flashes and hard-resets through.
  ; ARDUINO_USB_MODE=1 selects the S3's built-in USB-Serial-JTAG (HWCDC); with
  ; CDC_ON_BOOT=1 plain `Serial` is that console, and it is also the port esptool flashes
  ; and resets through.
  ;
  ; Do NOT switch this to 0 for USB-MSC. Tried and reverted: mode 0 moves the port to
  ; TinyUSB CDC, which the FIRMWARE creates rather than ROM. esptool's `--before
  ; default-reset` then has nothing to drive, every flash fails with "No serial data
  ; received", and a firmware that hangs before USB init leaves no port at all. Cable
  ; Transfer is not worth making the device unflashable.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DINX_SERIAL=Serial
  ; SD on the X4 Pro is 1-bit native SDMMC (CLK41/CMD42/DAT0 40 + the active-low
  ; GPIO5 enable), not SPI — the card is silent to SPI-mode CMD0 on this board.
  ; SdFat can't drive SDIO, so FreeInk mounts an FsVolume on an esp-idf SDMMC
  ; block device, and that needs SdFat's generic block-device interface:
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  ; (FREEINK_SD_SDMMC auto-enables for X4 Pro; -DFREEINK_SD_SDMMC=0 would force
  ; the SPI/SdFat path, which does not work on this hardware.)
  -DINX_VERSION=\"${inx.version}\"

; FrontlightManager drives the X4 Pro's two LEDC channels (GPIO8 cool / GPIO9 warm,
; 10 kHz / 10-bit) and mixes them for colour temperature. Sticky has no frontlight.
lib_deps =
  ${s3_common.lib_deps}
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager

; VoiceNoteActivity is the mic-backed recorder UI; it links freeink-sdk's
; Microphone, which this board has no hardware for. The startVoiceNote* entry
; points compile to no-ops under !FREEINK_CAP_MIC, so dropping the source here
; leaves no dangling references.
build_src_filter =
  ${s3_common.build_src_filter}
  +<system/TouchOrientationX4Pro.cpp>
  -<activity/reader/Epub/VoiceNoteActivity.cpp>

[env:simulator]
platform = native
custom_run_simulator_target_owner = project
build_src_filter =
  +<*>
  -<simulator/web/>
  -<network/OtaUpdater.cpp>
build_flags =
  -std=gnu++2a
  -DINX_SERIAL=Serial
  !sdl2-config --cflags --libs
  -Wno-c++11-narrowing
  -DSIMULATOR
  -DCROSSPOINT_SIMULATOR_PROJECT_WEBSERVER
  -DINX_VERSION=\"${inx.version}-simulator\"
  -DCROSSPOINT_VERSION=\"${inx.version}-simulator\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DDISABLE_FS_H_WARNING=1
  -include${PROJECT_DIR}/src/simulator/SimulatorCompat.h
  -Isrc/simulator
  -Isrc
  -Isrc/system
  -Ilib/GfxRenderer
  -Ilib/EpdFont
  -Ilib/FsHelpers
  -Ilib/JpegToBmpConverter
  -Ilib/PngToBmpConverter
  -Ilib/Serialization
  -Ilib/Utf8
  -Ilib/Txt
  -Ilib/Epub
  -Ilib/OpdsParser
  -Ilib/KOReaderSync
  -Ilib/Xtc
  -Ilib/Pdf
  -Ilib/ZipFile
  -Ilib/miniz
  -Ilib/InflateReader
lib_ignore = hal, WebSockets, PNGdec, JPEGDEC
extra_scripts =
  pre:scripts/build_html.py
  post:.pio/libdeps/$PIOENV/simulator/run_simulator_project.py
lib_deps =
  simulator=https://github.com/crosspoint-reader/crosspoint-simulator
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1

[env:simulator_web]
platform = native
custom_run_simulator_target_owner = project
build_src_filter =
  +<simulator/web/web_dashboard_main.cpp>
  +<network/LocalServer.cpp>
  +<state/SystemSetting.cpp>
  +<state/ReaderSetting.cpp>
  +<state/NetworkCredential.cpp>
  +<dictionary/StarDictLookup.cpp>
  +<util/StringUtils.cpp>
build_flags =
  -std=gnu++2a
  -DINX_SERIAL=Serial
  !sdl2-config --cflags --libs
  -Wno-c++11-narrowing
  -DSIMULATOR
  -DINX_SIMULATOR_WEB_ONLY
  -DCROSSPOINT_SIMULATOR_PROJECT_WEBSERVER
  -DINX_VERSION=\"${inx.version}-simulator-web\"
  -DCROSSPOINT_VERSION=\"${inx.version}-simulator-web\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DDISABLE_FS_H_WARNING=1
  -include${PROJECT_DIR}/src/simulator/SimulatorCompat.h
  -Isrc/simulator/web
  -Isrc/simulator
  -Isrc
  -Isrc/system
lib_ignore = hal, WebSockets, KOReaderSync, Epub, FsHelpers, GfxRenderer, EpdFont
extra_scripts =
  pre:scripts/build_html.py
  post:.pio/libdeps/$PIOENV/simulator/run_simulator_project.py
lib_deps =
  simulator=https://github.com/crosspoint-reader/crosspoint-simulator
  bblanchon/ArduinoJson @ 7.4.2
