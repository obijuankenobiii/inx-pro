name: Compile Release
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build Sticky
        run: |
          pio run -e sticky
          mkdir -p "${GITHUB_WORKSPACE}/release"
          test -s "${GITHUB_WORKSPACE}/.pio/build/sticky/firmware.factory.bin"
          cp "${GITHUB_WORKSPACE}/.pio/build/sticky/firmware.factory.bin" "${GITHUB_WORKSPACE}/release/sticky.bin"

      - name: Build X4 Pro
        run: |
          pio run -e x4pro
          test -s "${GITHUB_WORKSPACE}/.pio/build/x4pro/firmware.bin"
          cp "${GITHUB_WORKSPACE}/.pio/build/x4pro/firmware.bin" "${GITHUB_WORKSPACE}/release/x4pro.bin"

      - name: Prepare release images
        run: |
          test -s "${GITHUB_WORKSPACE}/release/sticky.bin"
          test -s "${GITHUB_WORKSPACE}/release/x4pro.bin"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Inx-${{ github.ref_name }}
          path: |
            release/sticky.bin
            release/x4pro.bin

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/sticky.bin
            release/x4pro.bin
