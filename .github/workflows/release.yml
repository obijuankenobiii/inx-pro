name: Compile Release
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Build Sticky
        run: |
          pio run -e sticky
          mkdir -p "${GITHUB_WORKSPACE}/release"
          # OTA writes this asset directly into an app OTA partition.  The
          # merged factory image also contains the bootloader, partition table,
          # and boot_app0 at offsets before the app, so it is only suitable for
          # a full-flash uploader and fails OTA image validation at install end.
          test -s "${GITHUB_WORKSPACE}/.pio/build/sticky/firmware.bin"
          test -s "${GITHUB_WORKSPACE}/.pio/build/sticky/firmware.factory.bin"
          cp "${GITHUB_WORKSPACE}/.pio/build/sticky/firmware.bin" "${GITHUB_WORKSPACE}/release/sticky.bin"
          cp "${GITHUB_WORKSPACE}/.pio/build/sticky/firmware.factory.bin" "${GITHUB_WORKSPACE}/release/sticky-merged.bin"

      - name: Build X4 Pro
        run: |
          pio run -e x4pro
          test -s "${GITHUB_WORKSPACE}/.pio/build/x4pro/firmware.bin"
          cp "${GITHUB_WORKSPACE}/.pio/build/x4pro/firmware.bin" "${GITHUB_WORKSPACE}/release/x4pro.bin"

      - name: Build Murphy M4
        run: |
          pio run -e murphy_m4
          test -s "${GITHUB_WORKSPACE}/.pio/build/murphy_m4/firmware.bin"
          cp "${GITHUB_WORKSPACE}/.pio/build/murphy_m4/firmware.bin" "${GITHUB_WORKSPACE}/release/murphy_m4.bin"

      - name: Build Picco
        run: |
          pio run -e picco
          test -s "${GITHUB_WORKSPACE}/.pio/build/picco/firmware.bin"
          cp "${GITHUB_WORKSPACE}/.pio/build/picco/firmware.bin" "${GITHUB_WORKSPACE}/release/picco.bin"

      - name: Build T5 S3
        run: |
          pio run -e t5s3
          test -s "${GITHUB_WORKSPACE}/.pio/build/t5s3/firmware.bin"
          cp "${GITHUB_WORKSPACE}/.pio/build/t5s3/firmware.bin" "${GITHUB_WORKSPACE}/release/t5s3.bin"

      - name: Prepare release images
        run: |
          test -s "${GITHUB_WORKSPACE}/release/sticky.bin"
          test -s "${GITHUB_WORKSPACE}/release/sticky-merged.bin"
          test -s "${GITHUB_WORKSPACE}/release/x4pro.bin"
          test -s "${GITHUB_WORKSPACE}/release/murphy_m4.bin"
          test -s "${GITHUB_WORKSPACE}/release/picco.bin"
          test -s "${GITHUB_WORKSPACE}/release/t5s3.bin"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Inx-${{ github.ref_name }}
          path: |
            release/sticky.bin
            release/sticky-merged.bin
            release/x4pro.bin
            release/murphy_m4.bin
            release/picco.bin
            release/t5s3.bin

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: |
            release/sticky.bin
            release/sticky-merged.bin
            release/x4pro.bin
            release/murphy_m4.bin
            release/picco.bin
            release/t5s3.bin
