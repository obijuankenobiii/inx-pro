<!doctype html>
<html lang="en">
<meta charset="UTF-8">
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<title>Inx — Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f7;color:#22272b;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.4}
a{color:inherit}
.container{max-width:1180px;margin:0 auto;padding:34px 28px 48px}
.header,.nav-links{display:none}
.recents-panel{background:#fff;border:1px solid #d9dde0;border-radius:5px;padding:28px 30px 32px;box-shadow:0 1px 2px rgba(22,28,32,.04)}
.recents-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:26px;border-bottom:1px solid #e3e6e8;padding-bottom:16px}
.recents-heading h2{margin:0;font-size:27px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.recents-heading p{margin:7px 0 0;color:#70777c;font-size:14px}
.recents-library{border:1px solid #cdd2d5;border-radius:4px;padding:9px 13px;text-decoration:none;font-size:13px;font-weight:700;white-space:nowrap}
.recents-library:hover{background:#f0f2f3;border-color:#8f979c}
.recents-list{display:flex;gap:22px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:thin}
.recent-card{position:relative;display:block;flex:0 0 150px;min-width:0}
.recent-open{display:block;color:inherit;text-decoration:none;cursor:pointer}
.recent-open:hover .recent-cover{border-color:#8f979c;box-shadow:0 5px 12px rgba(22,28,32,.14);transform:translateY(-2px)}
.recent-cover{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#e9ecee;border:1px solid #d3d8db;border-radius:4px;box-shadow:0 2px 6px rgba(22,28,32,.1);transition:transform .15s,box-shadow .15s,border-color .15s}
.recent-placeholder{display:flex;align-items:center;justify-content:center;padding:14px;text-align:center;color:#60686d;font-size:14px;font-weight:700}
.recent-title{display:block;margin-top:10px;overflow:hidden;color:#252a2e;font-size:15px;font-weight:700;line-height:1.2;text-overflow:ellipsis;white-space:nowrap}
.recent-author{display:block;margin-top:4px;overflow:hidden;color:#737a7f;font-size:13px;line-height:1.2;text-overflow:ellipsis;white-space:nowrap}
.recent-progress{display:flex;align-items:center;gap:7px;margin-top:9px;color:#858c90;font-size:11px}
.recent-progress-track{display:block;flex:1;height:4px;overflow:hidden;background:#e1e5e7;border-radius:2px}
.recent-progress-fill{display:block;height:100%;background:#424a4f;border-radius:2px}
.recent-remove{position:absolute;z-index:2;top:7px;right:7px;width:27px;height:27px;display:grid;place-items:center;padding:0;border:1px solid rgba(255,255,255,.8);border-radius:4px;background:rgba(255,255,255,.92);color:#596167;box-shadow:0 2px 6px rgba(22,28,32,.18);cursor:pointer}
.recent-remove svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.recent-remove:hover{background:#fff;color:#b3261e;border-color:#c8ced1}
.recent-remove:disabled{opacity:.5;cursor:wait}
.recent-empty{grid-column:1/-1;padding:62px 20px;text-align:center;color:#777f84;font-size:15px}
.dashboard-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-bottom:12px;border:1px solid #d9dde0;background:#d9dde0}
.dashboard-stat{min-width:0;padding:13px 16px;background:#fff}
.dashboard-stat-label{display:block;color:#737a7f;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.dashboard-stat-value{display:block;margin-top:4px;color:#22272b;font-size:22px;font-weight:700;line-height:1}
@media (max-width:780px){.container{padding:20px 16px 32px}.dashboard-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.recents-panel{padding:22px 18px 26px}.recents-list{gap:16px;padding-bottom:10px}.recent-card{flex-basis:126px}.recents-heading{align-items:flex-start;flex-direction:column;margin-bottom:20px}.recents-library{align-self:flex-start}}
@media (max-width:440px){.recent-card{flex-basis:118px}.recents-heading h2{font-size:24px}}
</style>
<div class="container">
  <div class="header"><h1>Inx</h1></div>
  <div class="nav-links">
    <a href="/" class="nav-btn active">Dashboard</a>
    <a href="/files" class="nav-btn">Files</a>
    <a href="/epub" class="nav-btn">Epub</a>
    <a href="/font-manager" class="nav-btn">Fonts</a>
    <a href="/settings" class="nav-btn">Settings</a>
  </div>
  <section class="dashboard-stats" aria-label="Reading statistics">
    <div class="dashboard-stat"><span class="dashboard-stat-label">Recent</span><strong class="dashboard-stat-value" id="stat-recent">—</strong></div>
    <div class="dashboard-stat"><span class="dashboard-stat-label">Reading</span><strong class="dashboard-stat-value" id="stat-reading">—</strong></div>
    <div class="dashboard-stat"><span class="dashboard-stat-label">Finished</span><strong class="dashboard-stat-value" id="stat-finished">—</strong></div>
    <div class="dashboard-stat"><span class="dashboard-stat-label">Favorites</span><strong class="dashboard-stat-value" id="stat-favorites">—</strong></div>
  </section>
  <main class="recents-panel">
    <div class="recents-heading">
      <div><h2>Recents</h2><p id="recents-summary">Your recently opened books</p></div>
      <a class="recents-library" href="/epub">View library</a>
    </div>
    <div class="recents-list" id="recents-list">
      <div class="recent-empty">Loading recent books…</div>
    </div>
  </main>
</div>
<script>
function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,function(ch){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]})}
function escapeAttr(value){return escapeHtml(value)}
function progressBar(progress){
  const known=typeof progress==="number"&&isFinite(progress);
  const percent=known?Math.max(0,Math.min(100,Math.round(progress*100))):0;
  return '<span class="recent-progress" aria-label="'+(known?percent+"% read":"Progress unavailable")+'"><span class="recent-progress-track"><span class="recent-progress-fill" style="width:'+percent+'%"></span></span><span>'+(known?percent+"%":"—")+'</span></span>';
}
function renderRecents(books){
  const list=document.getElementById("recents-list"),summary=document.getElementById("recents-summary");
  document.getElementById("stat-recent").textContent=books.length;
  summary.textContent=books.length?books.length+" recently opened book"+(books.length===1?"":"s"):"No recently opened books";
  if(!books.length){list.innerHTML='<div class="recent-empty">Open a book to see it here.</div>';return}
  list.innerHTML=books.map(function(book){
    const path=String(book.path||"");
    const title=book.title||"Untitled book";
    const author=book.author||"";
    const cover=book.coverUrl?'<img class="recent-cover" loading="lazy" src="'+escapeAttr(book.coverUrl)+'" alt="">':'<div class="recent-cover recent-placeholder">'+escapeHtml(title)+'</div>';
    const href='/epub-viewer.html?path='+encodeURIComponent(path);
    const removeIcon='<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5.5h12M8 5.5V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5M8.5 9v5M11.5 9v5M5.5 5.5 6.2 16a1 1 0 0 0 1 .9h5.6a1 1 0 0 0 1-.9l.7-10.5"/></svg>';
    return '<div class="recent-card"><a class="recent-open" href="'+href+'">'+cover+'<span class="recent-title" title="'+escapeAttr(title)+'">'+escapeHtml(title)+'</span>'+(author?'<span class="recent-author" title="'+escapeAttr(author)+'">'+escapeHtml(author)+'</span>':'<span class="recent-author">&nbsp;</span>')+progressBar(book.progress)+'</a><button class="recent-remove" type="button" data-path="'+escapeAttr(path)+'" aria-label="Remove from recents" title="Remove from recents">'+removeIcon+'</button></div>';
  }).join("");
  document.querySelectorAll(".recent-remove").forEach(function(button){
    button.addEventListener("click",removeRecentBook);
  });
}
async function removeRecentBook(event){
  event.preventDefault();
  event.stopPropagation();
  const button=event.currentTarget, card=button.closest(".recent-card"), path=button.dataset.path;
  if(!path||!card)return;
  button.disabled=true;
  try{
    const response=await fetch("/api/recent",{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({path:path})});
    if(!response.ok)throw new Error("HTTP "+response.status);
    card.remove();
    const remaining=document.querySelectorAll(".recent-card").length;
    document.getElementById("stat-recent").textContent=remaining;
    const summary=document.getElementById("recents-summary");
    summary.textContent=remaining?remaining+" recently opened book"+(remaining===1?"":"s"):"No recently opened books";
    if(!remaining)document.getElementById("recents-list").innerHTML='<div class="recent-empty">Open a book to see it here.</div>';
  }catch(error){
    console.error("Unable to remove recent book",error);
    button.disabled=false;
  }
}
async function loadDashboardStats(){
  try{
    const response=await fetch("/api/dashboard-stats");
    if(!response.ok)throw new Error("HTTP "+response.status);
    const stats=await response.json();
    document.getElementById("stat-reading").textContent=stats.reading??0;
    document.getElementById("stat-finished").textContent=stats.finished??0;
    document.getElementById("stat-favorites").textContent=stats.favorites??0;
  }catch(error){
    console.error("Unable to load dashboard stats",error);
    ["stat-reading","stat-finished","stat-favorites"].forEach(function(id){document.getElementById(id).textContent="—"});
  }
}
async function loadRecents(){
  try{const response=await fetch("/api/recent");if(!response.ok)throw new Error("HTTP "+response.status);renderRecents(await response.json())}
  catch(error){console.error("Unable to load recent books",error);document.getElementById("recents-summary").textContent="Unable to load recent books";document.getElementById("recents-list").innerHTML='<div class="recent-empty">Recent books are unavailable right now.</div>'}
}
loadRecents();
loadDashboardStats();
</script>
</html>
